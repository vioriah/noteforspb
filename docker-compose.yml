services:
  fortranlab:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MAX_PARALLEL=4
      - RUN_TIMEOUT_MS=5000
    # ограничения для запуска чужого кода
    read_only: true
    tmpfs:
      - /tmp:size=256m,exec
    mem_limit: 1g
    pids_limit: 128
    cpus: 2
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
